<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F6F9FC" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="0" y="75" width="1440" height="1" rx="0" fill="#D9E4EC" stroke="none" stroke-width="1"/>
<rect x="34" y="22" width="34" height="34" rx="10" fill="#245F95" stroke="none" stroke-width="1"/>
<text x="51" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">闲</text>
<text x="80" y="49" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">拾光 · 二手交易</text>
<text x="420" y="48" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">发现</text>
<text x="565" y="48" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">发布商品</text>
<text x="710" y="48" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">我的商品</text>
<text x="855" y="48" fill="#245F95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" text-anchor="start">我的预约</text>
<rect x="1220" y="23" width="150" height="32" rx="16" fill="#E9F3EE" stroke="none" stroke-width="1"/><text x="1295.0" y="45" fill="#277450" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="middle">买家</text>
<text x="45" y="135" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">预约结果与状态冲突</text>
<text x="45" y="167" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">重复提交、他人抢先与旧页面状态变化应分别提示</text>
<rect x="75" y="220" width="610" height="520" rx="20" fill="#FFFFFF" stroke="#DCE7EF" stroke-width="1"/>
<rect x="112" y="260" width="106" height="32" rx="16" fill="#E7F5EC" stroke="none" stroke-width="1"/><text x="165.0" y="282" fill="#28774B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="middle">预约成功</text>
<text x="112" y="350" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start">已为你创建待确认预约</text>
<text x="112" y="410" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">卖家将在24小时内同意或拒绝。</text>
<text x="112" y="455" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">联系方式暂不展示。</text>
<rect x="112" y="575" width="240" height="50" rx="12" fill="#245F95" stroke="none" stroke-width="1"/><text x="232.0" y="607" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle">查看我的预约</text>
<rect x="725" y="220" width="640" height="520" rx="20" fill="#FFFFFF" stroke="#DCE7EF" stroke-width="1"/>
<rect x="765" y="260" width="106" height="32" rx="16" fill="#FFF0E5" stroke="none" stroke-width="1"/><text x="818.0" y="282" fill="#A96523" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="middle">状态冲突</text>
<text x="765" y="352" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start">商品状态已变更，当前无法预约</text>
<text x="765" y="408" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">旧页面操作已被拒绝；请刷新页面。</text>
<text x="765" y="460" fill="#B45D45" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">他人抢先：手慢了，商品已被他人预约</text>
<text x="765" y="505" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">本人重复点击：提示已预约成功，不新建记录</text>
<rect x="765" y="575" width="240" height="50" rx="12" fill="#245F95" stroke="none" stroke-width="1"/><text x="885.0" y="607" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle">刷新商品详情</text>
</svg>