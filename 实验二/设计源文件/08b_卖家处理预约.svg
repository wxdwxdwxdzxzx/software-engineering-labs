<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F6F9FC" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="0" y="75" width="1440" height="1" rx="0" fill="#D9E4EC" stroke="none" stroke-width="1"/>
<rect x="34" y="22" width="34" height="34" rx="10" fill="#245F95" stroke="none" stroke-width="1"/>
<text x="51" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">闲</text>
<text x="80" y="49" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">拾光 · 二手交易</text>
<text x="420" y="48" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">发现</text>
<text x="565" y="48" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">发布商品</text>
<text x="710" y="48" fill="#245F95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" text-anchor="start">我的商品</text>
<text x="855" y="48" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">我的预约</text>
<rect x="1220" y="23" width="150" height="32" rx="16" fill="#E9F3EE" stroke="none" stroke-width="1"/><text x="1295.0" y="45" fill="#277450" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="middle">卖家</text>
<text x="45" y="135" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">买家预约处理</text>
<text x="45" y="167" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" text-anchor="start">只有卖家能同意、拒绝与确认线下交易完成</text>
<rect x="55" y="220" width="1330" height="190" rx="18" fill="#FFFFFF" stroke="#DCE7EF" stroke-width="1"/>
<rect x="95" y="255" width="106" height="32" rx="16" fill="#E3EFF8" stroke="none" stroke-width="1"/><text x="148.0" y="277" fill="#245F95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="middle">待确认</text>
<text x="95" y="328" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">机械键盘 · 买家等待你处理</text>
<text x="95" y="372" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">请在预约发起后24小时内处理；双方联系方式仍隐藏</text>
<rect x="910" y="290" width="180" height="50" rx="12" fill="#E5EFF6" stroke="none" stroke-width="1"/><text x="1000.0" y="322" fill="#245F95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle">拒绝预约</text>
<rect x="1110" y="290" width="210" height="50" rx="12" fill="#245F95" stroke="none" stroke-width="1"/><text x="1215.0" y="322" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle">同意预约</text>
<rect x="55" y="435" width="1330" height="190" rx="18" fill="#FFFFFF" stroke="#DCE7EF" stroke-width="1"/>
<rect x="95" y="470" width="106" height="32" rx="16" fill="#E7F5EC" stroke="none" stroke-width="1"/><text x="148.0" y="492" fill="#28774B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" text-anchor="middle">待交易</text>
<text x="95" y="545" fill="#18324A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">桌面台灯 · 线下交易进行中</text>
<text x="95" y="590" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">联系信息仅双方可见；实际钱货交接在线下完成</text>
<rect x="900" y="505" width="180" height="50" rx="12" fill="#E5EFF6" stroke="none" stroke-width="1"/><text x="990.0" y="537" fill="#245F95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle">取消交易</text>
<rect x="1100" y="505" width="220" height="50" rx="12" fill="#245F95" stroke="none" stroke-width="1"/><text x="1210.0" y="537" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" text-anchor="middle">确认交易完成</text>
<text x="70" y="710" fill="#617487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">商品进入已售出后留在卖家主页；历史预约保留。</text>
